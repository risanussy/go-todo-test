<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 820px">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">Todo List</h1>
                <p class="text-secondary mb-0">{{.Completed}} dari {{.Total}} tugas selesai</p>
            </div>
            <span class="badge rounded-pill text-bg-primary fs-6">Go + MySQL</span>
        </div>

        <section class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <form action="/todos" method="post" class="row g-2">
                    <div class="col">
                        <label for="title" class="visually-hidden">Todo baru</label>
                        <input id="title" name="title" class="form-control form-control-lg" maxlength="255" placeholder="Apa yang ingin dikerjakan?" required autofocus>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary btn-lg" type="submit">Tambah</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card border-0 shadow-sm">
            <div class="list-group list-group-flush">
                {{range .Todos}}
                <div class="list-group-item p-3">
                    <div class="d-flex align-items-center gap-3">
                        <form action="/todos/{{.ID}}/toggle" method="post">
                            <button class="btn {{if .Completed}}btn-success{{else}}btn-outline-secondary{{end}} rounded-circle" type="submit" aria-label="Ubah status">
                                {{if .Completed}}✓{{else}}○{{end}}
                            </button>
                        </form>
                        <div class="flex-grow-1 overflow-hidden">
                            <div class="{{if .Completed}}text-decoration-line-through text-secondary{{end}} text-break">{{.Title}}</div>
                            <small class="text-secondary">{{.CreatedAt.Format "02 Jan 2006, 15:04"}}</small>
                        </div>
                        <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#edit-{{.ID}}">Edit</button>
                        <form action="/todos/{{.ID}}/delete" method="post" onsubmit="return confirm('Hapus todo ini?')">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Hapus</button>
                        </form>
                    </div>
                </div>

                <div class="modal fade" id="edit-{{.ID}}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <form action="/todos/{{.ID}}/update" method="post">
                                <div class="modal-header">
                                    <h2 class="modal-title fs-5">Edit Todo</h2>
                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                                </div>
                                <div class="modal-body">
                                    <label for="title-{{.ID}}" class="form-label">Judul</label>
                                    <input id="title-{{.ID}}" name="title" class="form-control" value="{{.Title}}" maxlength="255" required>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                                    <button type="submit" class="btn btn-primary">Simpan</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                {{else}}
                <div class="text-center p-5 text-secondary">
                    <div class="fs-1 mb-2">✓</div>
                    <p class="mb-0">Belum ada todo. Tambahkan tugas pertama kamu.</p>
                </div>
                {{end}}
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
